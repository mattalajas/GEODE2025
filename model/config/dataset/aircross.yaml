#### Dataset params ###########################################################
name: aircross

# spatial shift
spatial_shift: False
order: 0
node_features: CC
include_exog: False
test_months: [3, 6, 9, 12]
years: [2018]

# Point
mode: 'region'
exog: traffic
p_fault: 0.
p_noise: 0.25

splitting:
  val_len: 0.1
  test_len: 0.2
connectivity:
  method: precomputed
  threshold: 0.1
  include_self: False